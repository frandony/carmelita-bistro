name: Supabase keep-alive
 
# O plano gratuito do Supabase pausa o projeto apos ~7 dias sem atividade.
# Este workflow faz uma leitura real no banco a cada 2 dias para evitar a pausa.
on:
  schedule:
    - cron: "17 9 */2 * *"   # 06:17 (Brasilia), dia sim, dia nao
  workflow_dispatch:          # permite rodar manualmente pela aba Actions
 
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://cjxhpbqurgephxyemjlv.supabase.co
      # Chave anon publica (a mesma que ja esta no app.jsx). Nao e segredo.
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqeGhwYnF1cmdlcGh4eWVtamx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NzM4NTQsImV4cCI6MjEwNTI0OTg1NH0.xKwGHWfI3KiverKvn0JK1XTvnpzRKg0DSTrnyB6qXIw
    steps:
      - name: Consulta a tabela site_menus
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --retry 3 --retry-delay 20 --max-time 60 \
            "$SUPABASE_URL/rest/v1/site_menus?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          head -c 300 /tmp/resp.txt; echo
          # Falha o job (e o GitHub avisa por e-mail) se o banco nao responder 200.
          test "$code" = "200"
 
